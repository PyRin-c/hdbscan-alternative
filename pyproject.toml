[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "hdbscan-alternative"
description = "An independent Rust implementation of HDBSCAN"
readme = "Readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = ["joblib>=1.2", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8", "networkx>=3.2", "pandas>=2.1"]

[project.urls]
Repository = "https://github.com/PyRin-c/hdbscan-alternative"
Releases = "https://github.com/PyRin-c/hdbscan-alternative/releases"

[dependency-groups]
dev = ["maturin==1.16.0", "pytest"]

[tool.uv.dependency-groups]
dev = { requires-python = "==3.13.*" }

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/hdbscan-python/Cargo.toml"
python-source = "python"
module-name = "hdbscan_alternative._native"
locked = true
exclude = ["**/__pycache__/**", "**/*.pdb"]

[tool.maturin.sbom]
rust = false

[tool.pytest.ini_options]
testpaths = ["tests"]
